<title>築本模板工程計算</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="築本模板">
<meta name="theme-color" content="#101a5c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: 首頁為全螢幕品牌畫面；工作區為上方工具列 + 分頁 + 寬表格（各自橫向捲動） */
:root{
  --navy:#101a5c; --royal:#2b3fae;
  --bg:#eef0f6; --surface:#ffffff; --surface2:#f6f7fb; --ink:#171a2e; --muted:#5a5f7a; --line:#d6d9e6;
  --accent:#2b3fae; --accent-ink:#ffffff; --hl:rgba(43,63,174,.10);
  --red:#c0262d; --ok:#1c7a4c; --warn:#a86300; --wall:#c0262d; --seal:#0b7fb5; --col:#d07a00;
  --paper:#ffffff; --paper-ink:#111111; --paper-line:#3a3a3a; --paper-sub:#f1f1f1;
  --cad-bg:#0d1230; --cad-ink:#cfd6ff;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0f22; --surface:#151935; --surface2:#1b2042; --ink:#e6e8f6; --muted:#9ca2c6; --line:#2b3158;
  --accent:#93a2ff; --accent-ink:#0c0f22; --hl:rgba(147,162,255,.14);
  --red:#ff7a7f; --ok:#5fd39a; --warn:#ffb54d; --wall:#ff7a7f; --seal:#5cc8ff; --col:#ffb54d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0f22; --surface:#151935; --surface2:#1b2042; --ink:#e6e8f6; --muted:#9ca2c6; --line:#2b3158;
  --accent:#93a2ff; --accent-ink:#0c0f22; --hl:rgba(147,162,255,.14);
  --red:#ff7a7f; --ok:#5fd39a; --warn:#ffb54d; --wall:#ff7a7f; --seal:#5cc8ff; --col:#ffb54d; color-scheme:dark}
html,body{height:100%}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{overflow-x:hidden;max-width:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding-top:var(--toph,0px);background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- 首頁 ---------- */
#splash{position:fixed;inset:0;z-index:50;cursor:pointer;overflow:hidden;
  background:radial-gradient(120% 80% at 85% 0%,#3346b8 0%,transparent 55%),radial-gradient(90% 70% at 10% 100%,#3448c4 0%,transparent 60%),linear-gradient(160deg,#121c66 0%,#1b2a8a 45%,#22339f 100%);
  transition:opacity .7s ease, visibility .7s}
#splash.out{opacity:0;visibility:hidden}
#dots{position:absolute;inset:0;width:100%;height:100%}
.sp-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));pointer-events:none;text-align:center}
.sp-logo{width:min(240px,46vw);filter:drop-shadow(0 18px 30px rgba(5,10,50,.55));animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.sp-title{font-family:var(--f-display);font-weight:900;color:#fff;font-size:clamp(30px,6.4vw,58px);letter-spacing:.12em;margin:8px 0 0;text-shadow:0 4px 18px rgba(0,0,20,.45);text-wrap:balance}
.sp-sub{color:rgba(225,231,255,.82);font-family:var(--f-display);letter-spacing:.32em;font-size:clamp(10px,1.6vw,13px);margin:0}
@media (max-width:520px){.sp-sub{letter-spacing:.16em;font-size:9.5px}}
.sp-hint{position:absolute;left:0;right:0;bottom:max(36px,env(safe-area-inset-bottom,0px));text-align:center;color:rgba(235,240,255,.9);letter-spacing:.25em;font-size:13px;animation:pulse 2.4s ease-in-out infinite;pointer-events:none}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.sp-logo,.sp-hint{animation:none}}

/* ---------- 工作區 ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.top{position:fixed;top:0;left:0;right:0;z-index:9;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding-bottom:6px;padding-top:calc(6px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.top img{width:30px;height:auto}
.top .back{flex:none;font:inherit;font-size:14px;font-weight:600;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.top .back:active{background:rgba(255,255,255,.28)}
.brand{font-family:var(--f-display);font-weight:900;letter-spacing:.08em;font-size:17px;cursor:pointer;background:none;border:0;color:#fff;padding:0}
.top .crumb{color:rgba(220,226,255,.85);font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.top .sp{flex:1}
.top .crumb{flex:1}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 32px;width:100%;box-sizing:border-box}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-size:20px} h3{font-size:15px}
.muted{color:var(--muted)}
.small{font-size:12px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.ghost{background:transparent}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.top .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted);letter-spacing:.04em}
input[type=text],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:6px 8px;min-width:0}
textarea{width:100%;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:12px}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.pill{display:inline-block;border-radius:99px;padding:1px 8px;font-size:11px;border:1px solid currentColor;white-space:nowrap}
.pill.dxf{color:var(--accent)} .pill.man{color:var(--muted)} .pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)}
.note{border-left:3px solid var(--warn);background:var(--surface2);padding:10px 12px;border-radius:0 6px 6px 0}
.scroll{overflow-x:auto;max-width:100%}
table.data{border-collapse:collapse;width:100%;font-size:13px}
table.data th,table.data td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:middle;white-space:nowrap}
table.data th{font-size:12px;color:var(--muted);font-weight:500;background:var(--surface2);position:sticky;top:0;white-space:nowrap}
table.data td.r,table.data th.r{text-align:right}
table.data input,table.data select{padding:3px 5px;font-size:13px}
table.data input.w4{width:4.5em} table.data input.w6{width:6.5em} table.data input.w10{width:11em} table.data input.w14{width:15em}
table.data tr.bad td{background:color-mix(in srgb,var(--red) 10%,transparent)}
table.data tr.foot td{font-weight:700;border-top:2px solid var(--ink)}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left}
.pcard:hover{border-color:var(--accent)}
.pitem{position:relative;display:flex;flex-direction:column}.pitem .pcard{padding-right:70px;flex:1}
.pitem .pdel{position:absolute;top:10px;right:10px}
.pitem .pconf{margin-top:6px}
.pcard .code{font-family:var(--f-num);color:var(--muted);font-size:12px}
.pcard .nm{font-weight:700;font-size:16px}
.layout-draw{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px}
@media (max-width:900px){.layout-draw{grid-template-columns:minmax(0,1fr)}}
.dlist{display:flex;flex-direction:column;gap:6px}
.ditem{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.ditem[aria-current=true]{border-color:var(--accent);background:var(--hl)}
.cadbox{position:relative;background:var(--cad-bg);border-radius:8px;overflow:hidden;height:calc(100dvh - 150px);min-height:360px;touch-action:none}
.cadbox canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
.cadtools{position:absolute;top:8px;left:8px;display:flex;gap:6px;flex-wrap:wrap}
.cadtools .btn{background:rgba(13,18,48,.85);color:#dfe4ff;border-color:#39407a}
.cadinfo{position:absolute;right:8px;bottom:8px;max-width:min(360px,80%);background:rgba(13,18,48,.92);color:#e3e7ff;border:1px solid #39407a;border-radius:6px;padding:8px 10px;font-size:12px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:4px;vertical-align:-2px}
.layers{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.layers table{width:100%;border-collapse:collapse;font-size:12px}
.layers td{padding:3px 6px;border-bottom:1px solid var(--line)}
.layers select{font-size:12px;padding:2px}
.stat{display:flex;gap:18px;flex-wrap:wrap}
.stat div{display:flex;flex-direction:column}
.stat b{font-family:var(--f-num);font-size:20px}
.stat span{font-size:12px;color:var(--muted)}

/* ---------- 報表（紙本樣式，兩種主題都維持白紙） ---------- */
.sheet{background:var(--paper);color:var(--paper-ink);padding:28px 26px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.15);width:max-content;min-width:100%}
.sheet h1{font-size:22px;text-align:center;letter-spacing:.3em;margin-bottom:10px;font-family:var(--f-display)}
.sheet .meta{font-size:13px;line-height:1.7}
table.rep{border-collapse:collapse;font-size:13px;margin-top:8px}
table.rep th,table.rep td{border:1px solid var(--paper-line);padding:2px 5px;white-space:nowrap}
table.rep th{font-weight:500;background:var(--paper-sub)}
table.rep td.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
table.rep td.f{font-family:var(--f-num);font-size:12px;white-space:normal;max-width:15em}
table.rep td.real{color:#c0262d;font-weight:600}
table.rep tr.sub td{font-weight:700}
table.rep tr.tot td{font-weight:700;border-top:2px solid var(--paper-ink)}
table.rep td.c{text-align:center}
table.rep tr.click{cursor:pointer}
table.rep tr.click:hover td{background:#eef1ff}

/* ---------- 導引圖 ---------- */
.guide-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.gcard svg{width:100%;height:auto;max-width:100%}
.formula{font-family:var(--f-num);font-size:12.5px;background:var(--surface2);padding:8px 10px;border-radius:6px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
svg .g-ink{stroke:var(--ink);fill:none}
svg .g-txt{fill:var(--ink);font-family:var(--f-num);font-size:12px}
svg .g-lbl{fill:var(--muted);font-family:var(--f-body);font-size:12px}
svg .g-fill{fill:var(--hl);stroke:var(--accent);stroke-width:1.5}
svg .g-wall{stroke:var(--wall);stroke-width:4;fill:none}
svg .g-seal{stroke:var(--seal);stroke-width:4;fill:none;stroke-dasharray:8 4}
svg .g-col{fill:var(--col);fill-opacity:.55;stroke:var(--col)}
svg .g-form{stroke:var(--accent);stroke-width:4;fill:none}
svg .g-conc{fill:var(--muted);fill-opacity:.18;stroke:var(--muted)}
svg .g-dim{stroke:var(--muted);stroke-width:1}

/* ---------- 手機：一頁寬、不縮放 ---------- */
.sheet-fit{overflow:hidden}
@media (max-width:700px){
  input[type=text],input[type=number],select,textarea{font-size:16px}
  table.data input,table.data select{font-size:16px}
  .cadbox{height:58dvh;min-height:300px}
  table.cardify,table.cardify tbody{display:block;width:100%}
  table.cardify thead{display:none}
  table.cardify tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;background:var(--surface)}
  table.cardify td{display:flex;flex-direction:column;gap:2px;border:0;padding:0;min-width:0;white-space:normal;text-align:left}
  table.cardify td.r{text-align:left}
  table.cardify td::before{content:attr(data-label);font-size:11px;color:var(--muted)}
  table.cardify td:empty,table.cardify td.blank{display:none}
  table.cardify td.wide{grid-column:1/-1}
  table.cardify td[colspan]{grid-column:1/-1}
  table.cardify td[colspan]::before{content:none}
  table.cardify input:not([type=checkbox]),table.cardify select{width:100%!important}
  table.cardify input[type=checkbox]{width:22px;height:22px}
  .row{gap:8px}
}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;width:min(860px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(5,8,30,.55)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);gap:10px}
.dlg-b{padding:16px;overflow:auto;max-height:calc(100vh - 140px)}
.updbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;gap:10px;align-items:center;background:var(--surface);color:var(--ink);border:1px solid var(--accent);border-radius:10px;padding:8px 10px 8px 14px;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100vw - 32px);font-size:14px;white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px;z-index:80;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
</style>

<div id="splash" role="button" tabindex="0" aria-label="進入築本模板工程計算">
  <canvas id="dots"></canvas>
  <div class="sp-center">
    <img class="sp-logo" src="data:image/webp;base64,__LOGO__" alt="築本標誌">
    <h1 class="sp-title">築本模板工程計算</h1>
    <p class="sp-sub">ZHUBEN FORMWORK &amp; CONCRETE ESTIMATION</p>
  </div>
  <div class="sp-hint">點擊任意處進入</div>
</div>

<header class="top" id="top" hidden>
  <button class="back" id="back" data-act="home" hidden aria-label="返回專案列表">‹ 專案列表</button>
  <img src="data:image/webp;base64,__LOGO__" alt="">
  <button class="brand" data-act="home">築本模板工程計算</button>
  <span class="crumb" id="crumb"></span>
</header>
<main class="wrap" id="main" hidden></main>
<dialog id="dlg"><div class="dlg-h"><h3 id="dlgT"></h3><button class="btn sm" data-act="dlgclose">關閉</button></div><div class="dlg-b" id="dlgB"></div></dialog>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* =========================================================
   基本工具
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const r2=v=>Math.round((v+(v>=0?1e-9:-1e-9))*100)/100;
const f2=v=>(isFinite(v)?r2(v):0).toFixed(2);
const fs=v=>{v=r2(v);return v<0?'- '+(-v).toFixed(2):v.toFixed(2)};
const fm=v=>{ // 尺寸顯示：去除多餘 0
  if(!isFinite(v)) return '?'; return String(Math.round(v*1000)/1000);
};
const num=(v,d)=>{const n=parseFloat(v);return isFinite(n)?n:d};
const standalone=(()=>{try{return window.top===window.self}catch(e){return false}})();
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2200)}
function evalExpr(s){
  if(s==null) return 0; s=String(s).trim(); if(!s) return 0;
  s=s.replace(/[×xX＊]/g,'*').replace(/÷/g,'/').replace(/（/g,'(').replace(/）/g,')').replace(/＋/g,'+').replace(/－/g,'-');
  if(!/^[0-9+\-*/().\s]*$/.test(s)) return NaN;
  try{const v=Function('"use strict";return ('+s+')')();return (typeof v==='number'&&isFinite(v))?v:NaN}catch(e){return NaN}
}

/* =========================================================
   儲存：專案在 localStorage，圖檔圖元在 IndexedDB（失敗時只留在記憶體）
   ========================================================= */
const KEY='zhuben.projects.v1';
const S={projects:[],cur:null,tab:'draw',dwg:null,floorFilter:'',bldgFilter:'',sumB:'',repB:''};
function loadAll(){try{const j=localStorage.getItem(KEY);if(j)S.projects=JSON.parse(j)||[]}catch(e){}}
function saveAll(){try{localStorage.setItem(KEY,JSON.stringify(S.projects))}catch(e){toast('瀏覽器儲存空間不足或已停用，資料僅保留到關閉頁面')}}
const entCache=new Map();
let idb=null;
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('zhuben',1);r.onupgradeneeded=()=>r.result.createObjectStore('ents');r.onsuccess=()=>{idb=r.result;res()};r.onerror=()=>res()}catch(e){res()}})}
function entPut(id,ents){entCache.set(id,ents);try{if(idb)idb.transaction('ents','readwrite').objectStore('ents').put(ents,id)}catch(e){}}
function entDel(id){entCache.delete(id);try{if(idb)idb.transaction('ents','readwrite').objectStore('ents').delete(id)}catch(e){}}
function entGet(id){if(entCache.has(id))return Promise.resolve(entCache.get(id));return new Promise(res=>{try{if(!idb)return res(null);const r=idb.transaction('ents').objectStore('ents').get(id);r.onsuccess=()=>{if(r.result)entCache.set(id,r.result);res(r.result||null)};r.onerror=()=>res(null)}catch(e){res(null)}})}
const P=()=>S.projects.find(p=>p.id===S.cur);

/* =========================================================
   DXF 解析（ASCII DXF；支援 LINE / LWPOLYLINE / POLYLINE / TEXT / MTEXT / INSERT / CIRCLE / ARC / ATTRIB）
   ========================================================= */
function decodeDXF(buf){
  const u8=new Uint8Array(buf);
  const head=new TextDecoder('latin1').decode(u8.subarray(0,Math.min(u8.length,200000)));
  const ver=(head.match(/\$ACADVER\s*\r?\n\s*1\s*\r?\n\s*(AC\d+)/)||[])[1]||'';
  const cp=((head.match(/\$DWGCODEPAGE\s*\r?\n\s*3\s*\r?\n\s*(\S+)/)||[])[1]||'').toUpperCase();

/* 從圖名或檔名判斷樓層，例如「二、三層結構平面圖」「3~5F」「RF」「B1F」 */
const CNUM={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
function cnum(t){if(/^\d+$/.test(t))return +t;if(t.length===1)return CNUM[t]||NaN;if(t[0]==='十')return 10+(CNUM[t[1]]||0);if(t[1]==='十')return (CNUM[t[0]]||0)*10+(CNUM[t[2]]||0);return NaN}

/* 一個檔案裡有好幾張平面圖：找出各圖的圖名，把構件分配給最近的圖名（圖名在圖的下方） */

  arr.sort((a,b)=>a.el-b.el);

/* 兩張圖疊合後每個構件只算一次：

   牆依柱位把建築圖疊到結構圖上，與結構圖的牆重疊的部分不重複計算，牆上方有梁時牆高算到梁底

  P.drawings.forEach(d=>{d.wdup=0;d.wout=0;(d.wraw||[]).forEach(w=>{

function nowStr(){const d=new Date(),h=d.getHours(),ap=h<12?'上午':'下午',hh=h%12||12,z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}　${ap} ${z(hh)}:${z(d.getMinutes())}:${z(d.getSeconds())}`}
function repData(p,bldg){

function repTSV(p,b){

function svgSlab(s){
  const c=slabCalc(s);
  if(!s.geo){
    return `<svg viewBox="0 0 520 300" role="img" aria-label="版模板示意">
    <rect x="70" y="60" width="380" height="180" class="g-fill"/><text x="260" y="150" text-anchor="middle" class="g-txt">原始模板 ${esc(s.orig||'0')} = ${f2(c.o)} m²</text>

    <line x1="450" y1="60" x2="450" y2="240" class="g-wall"/><text x="460" y="150" class="g-lbl">牆</text>
    <rect x="70" y="60" width="26" height="26" class="g-col"/><text x="104" y="78" class="g-lbl">柱頭重疊 → 扣柱頭</text>
    <text x="260" y="22" text-anchor="middle" class="g-lbl">${esc(s.code)} · 版內編 ${esc(s.no)} · t=${fm(c.t)} m（手動輸入，無圖面幾何）</text></svg>`;
  }
  const G=s.geo,bb=bbox(G.pts),W=520,pad=56,H=Math.round(Math.max(200,Math.min(420,pad*2+(W-2*pad)*((bb[3]-bb[1])/((bb[2]-bb[0])||1))))),sc=Math.min((W-2*pad)/((bb[2]-bb[0])||1),(H-2*pad)/((bb[3]-bb[1])||1));
  const X=x=>pad+(x-bb[0])*sc+((W-2*pad)-(bb[2]-bb[0])*sc)/2,Y=y=>H-pad-(y-bb[1])*sc-((H-2*pad)-(bb[3]-bb[1])*sc)/2;
  const cen=centroid(G.pts);
  let o=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(s.code)} 版幾何導引圖"><polygon points="${G.pts.map(q=>X(q[0])+','+Y(q[1])).join(' ')}" class="g-fill"/>`;
  G.cols.forEach(cp=>o+=`<polygon points="${cp.map(q=>X(q[0])+','+Y(q[1])).join(' ')}" class="g-col"/>`);
  const area=polyArea(G.pts);
  G.edges.forEach(e=>{const mx=(X(e.a[0])+X(e.b[0]))/2,my=(Y(e.a[1])+Y(e.b[1]))/2;let nx=-(Y(e.b[1])-Y(e.a[1])),ny=X(e.b[0])-X(e.a[0]);const l=Math.hypot(nx,ny)||1;nx/=l;ny/=l;
    // 讓標註朝外
    const cx=X(cen[0]),cy=Y(cen[1]);if((mx+nx-cx)*(mx-cx)+(my+ny-cy)*(my-cy)<(mx-cx)**2+(my-cy)**2){nx=-nx;ny=-ny}
    if(e.wall>=0.05)o+=`<line x1="${X(e.a[0])}" y1="${Y(e.a[1])}" x2="${X(e.b[0])}" y2="${Y(e.b[1])}" class="g-wall"/>`;
    if(e.free>=0.05)o+=`<line x1="${X(e.a[0])}" y1="${Y(e.a[1])}" x2="${X(e.b[0])}" y2="${Y(e.b[1])}" class="g-seal"/>`;
    o+=`<text x="${mx+nx*18}" y="${my+ny*18+4}" text-anchor="middle" class="g-txt">${f2(e.L)}</text>`});
  o+=`<text x="${X(cen[0])}" y="${Y(cen[1])-6}" text-anchor="middle" class="g-txt" style="font-weight:600">${esc(s.code)} #${esc(s.no)}</text><text x="${X(cen[0])}" y="${Y(cen[1])+12}" text-anchor="middle" class="g-lbl">A = ${f2(Math.abs(area))} m²</text></svg>`;
  return o;
}

封模       = ${s.seal||'0'} = ${f2(c.se)}

function memFormula(m,p){const c=memCalc(m,p);return `${m.type} ${m.code||''}（${m.floor} 層）

function viewGuide(p){
  const demo={type:'柱',b:0.5,h:0.5,n:1,floor:p.floors[1]?.name||'1'},beam={type:'梁',b:0.3,h:0.6,L:5.5,n:1,floor:demo.floor},wall={type:'牆',b:0.2,L:5.5,n:1,open:1.2,floor:demo.floor};
  const slab={code:'S1',no:'—',orig:'5.7*4.75',seal:'',wall:'5.5*0.15',col:'0.1*0.15+0.1*0.15+0.1*0.1+0.1*0.1',t:0.15};
  return `<div class="stack">
  <div class="panel stack"><h3>檢核步驟</h3>
  <div class="formula">1. 圖檔：確認圖層對應正確（版外框、柱、梁、牆），單位為 mm。
2. 版明細：每一版點「導引」，核對面積、各邊長、紅色牆接頭邊、藍色封模邊、橘色柱頭重疊。
3. 模板報表：樓層小計 = 各版加總；真實模板 = 原始 + 封模 + 扣接頭合計（負值）。
4. 梁柱牆：核對 b、h、L、H 與數量，梁長取柱面間淨跨。
5. 總表：模板與混凝土依樓層彙總，總計應等於各明細之和。</div></div>
  <div class="guide-grid">
   <div class="gcard"><h3>版：原始模板、封模、扣版牆接頭、扣柱頭</h3>${svgSlab(slab)}<div class="formula">原始模板 = 版淨面積（梁、牆面之間）
封模 = 自由邊長 × 版厚 t（懸臂版外緣、開口邊）
扣版牆接頭 = 版與牆相接長度 × t
扣柱頭 = 柱斷面伸入版範圍的面積
真實模板 = 原始模板 + 封模 − 扣版牆接頭 − 扣柱頭
混凝土 = 原始模板 × t</div></div>
   <div class="gcard"><h3>柱</h3>${svgMember(demo,p)}<div class="formula">模板 = 2 × (b + h) × (H − ts) × 數量 − 扣除
混凝土 = b × h × (H − ts) × 數量
圓柱：模板 = π × D × (H − ts)，混凝土 = π × D² / 4 × (H − ts)</div></div>
   <div class="gcard"><h3>梁</h3>${svgMember(beam,p)}<div class="formula">模板 = (b + 2 × (h − ts)) × L
外側邊梁 = (b + (h − ts) + h) × L
混凝土 = b × h × L（L 取柱面間淨跨）</div></div>
   <div class="gcard"><h3>牆</h3>${svgMember(wall,p)}<div class="formula">模板 = 2 × L × (H − ts) − 2 × 開口面積
混凝土 = (L × (H − ts) − 開口面積) × t</div></div>
  </div></div>`;
}

async function importFiles(files){
  const p=P();const tot={n:0,s:0,c:0,b:0,w:0};
  for(const f of files){
    const buf=await f.arrayBuffer();const head=new TextDecoder('latin1').decode(new Uint8Array(buf.slice(0,6)));
    const isDwg=/\.dwg$/i.test(f.name)||/^AC10\d\d/.test(head);
    try{
      if(isDwg){toast(`正在解析 DWG：${f.name}（第一次需載入解析引擎，約數秒）`);await new Promise(r=>setTimeout(r,60))}
      const ents=isDwg?await parseDWG(buf):parseDXF(buf);
      if(!ents.lines.length&&!ents.polys.length&&!ents.texts.length)throw new Error('沒有讀到任何圖元');
      const d={id:uid(),name:f.name,floors:[],bldg:p.bldgs[0]||'A',unit:0.001,roles:{},layerCount:Object.keys(ents.layers).length,ext:ents.ext,ver:ents.ver};
      p.drawings.push(d);entPut(d.id,ents);S.dwg=d.id;
      const R=autoProcess(p,d,ents);tot.n++;tot.s+=R.slabs.length*d.floors.length;tot.c+=R.cols.length;tot.b+=R.beams.length;tot.w+=R.walls.length;
    }catch(e){openDlg(isDwg?'無法讀取 DWG':'無法讀取 DXF',isDwg?`<p>「${esc(f.name)}」（${esc(DWGVER[head]||head)}）解析失敗：${esc(e.message||e)}。</p><p class="muted small">內建的 LibreDWG 引擎支援 R13 到 AutoCAD 2018 以後的 DWG，少數含特殊物件的檔案可能失敗。遇到時可在 AutoCAD 另存為 DXF 再匯入。</p>`:`<p>「${esc(f.name)}」讀取失敗：${esc(e.message)}。請確認是 ASCII 格式的 DXF（二進位 DXF 請改存 ASCII）。</p>`)}
  }
  saveAll();render();
  if(tot.n)toast(`已計算 ${tot.n} 張圖：版 ${tot.s} 筆、柱 ${tot.c}、梁段 ${tot.b}、牆段 ${tot.w}`);
}

    saveAll();const c=memCalc(m,p);tr.querySelector('[data-out=form]').innerHTML=`<b>${f2(c.form)}</b>`;tr.querySelector('[data-out=conc]').textContent=f2(c.conc);tr.classList.toggle('bad',c.bad);return}

  if(t.dataset.fk){const i=+t.closest('tr').dataset.i,f=p.floors[i];if(t.dataset.fk==='name'){const old=f.name,nw=t.value.trim();if(!nw)return;f.name=nw;p.slabs.forEach(s=>{if(s.floor===old)s.floor=nw});p.members.forEach(m=>{if(m.floor===old)m.floor=nw});p.drawings.forEach(d=>d.floors=d.floors.map(x=>x===old?nw:x))}else f.h=num(t.value,f.h);saveAll();return}
});

function toggleFs(){if(fsOn()){const f=document.exitFullscreen||document.webkitExitFullscreen;if(f)try{const r=f.call(document);if(r&&r.catch)r.catch(()=>{})}catch(e){}}else goFs()}
function syncFs(){}
document.addEventListener('fullscreenchange',()=>{if(V.resize)V.resize()});
document.addEventListener('pointerup',()=>{if(S.view&&!fsOn())goFs()},true);document.addEventListener('webkitfullscreenchange',syncFs);
function copyText(s){
  const fb=()=>{openDlg('複製內容',`<p class="muted small">請全選下方文字後複製：</p><textarea id="cpy" rows="12">${esc(s)}</textarea>`);setTimeout(()=>{const t=$('#cpy');t.focus();t.select()},50)};
  try{navigator.clipboard.writeText(s).then(()=>toast('已複製，可直接貼到 Excel'),fb)}catch(e){fb()}
}
function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

/* =========================================================
   首頁：白點隨機閃爍
   ========================================================= */
(function splash(){
  const sp=$('#splash'),cv=$('#dots'),g=cv.getContext('2d');
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  let dots=[],W=0,H=0,dpr=1,raf=0,alive=true;
  function layout(){
    const r=sp.getBoundingClientRect();W=r.width;H=r.height;dpr=window.devicePixelRatio||1;cv.width=W*dpr;cv.height=H*dpr;
    const s=Math.max(56,Math.min(130,Math.min(W,H)/6.5)),ox=(W%s)/2+s/2-s/2,oy=(H%s)/2;
    dots=[];for(let y=oy+s/2;y<H;y+=s)for(let x=(W-Math.floor(W/s)*s)/2+s/2;x<W;x+=s)dots.push({x,y,r:s*0.085,base:0.22+Math.random()*0.12,ph:Math.random()*6.28,sp:0.4+Math.random()*0.8,f:0,fd:0});
  }
  function frame(t){
    if(!alive)return;g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
    const n=dots.length;
    if(!reduce){for(let i=0;i<Math.max(1,n*0.006);i++){if(Math.random()<0.6){const d=dots[(Math.random()*n)|0];if(d.f<=0){d.f=0.001;d.fd=0.012+Math.random()*0.02}}}}
    dots.forEach(d=>{
      let a=d.base+(reduce?0:Math.sin(t/1000*d.sp+d.ph)*0.06);let glow=0;
      if(d.f>0){d.f+=d.fd;const k=d.f<0.5?d.f*2:Math.max(0,2-d.f*2);glow=k;if(d.f>=1)d.f=0}
      if(glow>0){const R=d.r*(3+glow*3);const gr=g.createRadialGradient(d.x,d.y,0,d.x,d.y,R);gr.addColorStop(0,`rgba(255,255,255,${0.55*glow})`);gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.beginPath();g.arc(d.x,d.y,R,0,6.283);g.fill()}
      g.fillStyle=`rgba(235,240,255,${Math.min(1,a+glow*0.75)})`;g.beginPath();g.arc(d.x,d.y,d.r*(1+glow*0.25),0,6.283);g.fill();
    });
    raf=requestAnimationFrame(frame);
  }
  layout();window.addEventListener('resize',layout);raf=requestAnimationFrame(frame);
  const enter=()=>{if(sp.classList.contains('out'))return;goFs();syncFs();sp.classList.add('out');S.view='projects';render();setTimeout(()=>{alive=false;cancelAnimationFrame(raf);sp.hidden=true},800)};
  sp.addEventListener('click',enter);sp.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();enter()}});
  sp.focus();
})();

/* 新版本提示：網站版才有，按「更新」才重新載入 */
const BUILD='__BUILD__';
function checkUpdate(){
  if(!BUILD||BUILD.startsWith('__')||!/^https?:/.test(location.protocol))return;
  fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{
    if(!j||!j.v||j.v===BUILD||$('#updBar'))return;
    const b=document.createElement('div');b.id='updBar';b.className='updbar';
    b.innerHTML=`<span>有新版本可以更新</span><button class="btn pri sm" type="button">更新</button><button class="btn sm ghost" type="button" aria-label="稍後">稍後</button>`;
    const [u,l]=b.querySelectorAll('button');u.onclick=()=>location.replace(location.pathname+'?v='+encodeURIComponent(j.v));l.onclick=()=>b.remove();
    document.body.appendChild(b)}).catch(()=>{});
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
setInterval(checkUpdate,10*60*1000);setTimeout(checkUpdate,1500);
